# The database images the integration tests run against, pinned to a release so that a new image cannot change a
# run. ContainerImages.cs reads them from here, and Dependabot proposes a newer release in the same major. Not for
# running the databases: Testcontainers starts a container from each image. The weekly dependency lane also runs the
# tests against the newest releases (.github/workflows/dependency-lanes.yml).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
  postgres:
    image: postgres:16.15-alpine3.24
  mysql:
    image: mysql:8.4.11
