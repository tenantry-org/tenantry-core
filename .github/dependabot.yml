version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it (security updates are not delayed).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Microsoft's majors follow .NET's (EF Core 11 ships with .NET 11). A new major arrives as a new target
      # framework, added by hand with its own band, never as a routine bump.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      # Banded packages are declared with a version range, an MSBuild property, or a different version per
      # target framework. Their versions are set by hand: a range's floor is the oldest version supported,
      # and a per-framework version must stay in its framework's band, which Dependabot cannot keep to.
      # scripts/check-dependabot.cs (run in CI) fails when this list and the project files disagree.
      # Banded packages: begin
      - dependency-name: "Microsoft.AspNetCore.Authentication.JwtBearer"
      - dependency-name: "Microsoft.AspNetCore.Identity.EntityFrameworkCore"
      - dependency-name: "Microsoft.AspNetCore.Mvc.Testing"
      - dependency-name: "Microsoft.AspNetCore.TestHost"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
      - dependency-name: "Microsoft.EntityFrameworkCore.InMemory"
      - dependency-name: "Microsoft.EntityFrameworkCore.Relational"
      - dependency-name: "Microsoft.EntityFrameworkCore.Sqlite"
      - dependency-name: "Microsoft.EntityFrameworkCore.SqlServer"
      - dependency-name: "Microsoft.Extensions.Caching.Abstractions"
      - dependency-name: "Microsoft.Extensions.Caching.Hybrid"
      - dependency-name: "Microsoft.Extensions.DependencyInjection"
      - dependency-name: "Microsoft.Extensions.DependencyInjection.Abstractions"
      - dependency-name: "Microsoft.Extensions.Hosting"
      - dependency-name: "Microsoft.Extensions.Http"
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
      - dependency-name: "Microsoft.Extensions.Options"
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
      - dependency-name: "Pomelo.EntityFrameworkCore.MySql"
      - dependency-name: "Tenantry.AspNetCore"
      - dependency-name: "Tenantry.Core"
      - dependency-name: "Tenantry.EfCore"
      - dependency-name: "Tenantry.Caching"
      - dependency-name: "Tenantry.Http"
      - dependency-name: "Tenantry.Options"
      # Banded packages: end
    groups:
      # Minor and patch updates arrive as one pull request a week; each major update gets its own.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
