name: Dependabot lock files

# Dependabot's NuGet updater rewrites each multi-targeted packages.lock.json for one target framework only, so
# its pull requests fail CI's locked restore (NU1004). This regenerates the lock files for every framework on
# Dependabot's NuGet branches and commits them. It also gives eng/doc-snippets the exact versions the central package
# files now set (scripts/sync-eng-versions.cs): Dependabot cannot read that project, so a bump otherwise leaves its
# copies behind and scripts/check-dependabot.cs fails. Regenerating runs the pull request's restore, so it gets a
# read-only token; the job that commits runs nothing from the branch, and commits only lock files and, in
# eng/doc-snippets, changed Version attributes. A push made with the workflow's token starts no workflow itself, so the
# commit job then starts CI on the new commit.

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: dependabot-lock-files-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate lock files
    if: github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/nuget/')
    runs-on: ubuntu-latest
    # Well above a normal run, so a hung step fails the job instead of holding the runner for GitHub's default 6 hours
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.collect.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer needs full history
          persist-credentials: false

      - name: Setup .NET
        # The SDK global.json names, which builds both target frameworks and runs net11.0's tests, and the .NET 10
        # runtime, for net10.0's tests
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Regenerate
        run: dotnet restore Tenantry.slnx --force-evaluate

      - name: Raise eng/doc-snippets' exact versions
        run: dotnet run scripts/sync-eng-versions.cs

      - name: Collect changed files
        id: collect
        run: |
          git diff --name-only -- '*packages.lock.json' eng/doc-snippets/DocSnippets.csproj > changed.txt
          if [ -s changed.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            tar -cf lock-files.tar -T changed.txt
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          cat changed.txt

      - name: Upload lock files
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lock-files
          path: lock-files.tar
          retention-days: 1

  commit:
    name: Commit lock files and eng/doc-snippets' versions
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the lock files to Dependabot's branch
      actions: write    # start CI on the new commit

    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Download lock files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lock-files

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # Only lock files at paths the repository already tracks, and eng/doc-snippets
          tar -tf lock-files.tar | while read -r path; do
            case "$path" in
              */packages.lock.json) git ls-files --error-unmatch -- "$path" > /dev/null ;;
              eng/doc-snippets/DocSnippets.csproj) ;;
              *) echo "Unexpected file in the artifact: $path"; exit 1 ;;
            esac
          done
          tar -xf lock-files.tar && rm lock-files.tar
          # In eng/doc-snippets, nothing but Version attributes may change
          path=eng/doc-snippets/DocSnippets.csproj
          if ! diff <(git show "HEAD:$path" | sed -E 's/ Version="[^"]*"//') <(sed -E 's/ Version="[^"]*"//' "$path"); then
            echo "$path changed more than Version attributes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Regenerate lock files for every target framework, and give eng/doc-snippets the new exact versions"
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
