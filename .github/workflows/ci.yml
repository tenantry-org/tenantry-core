name: CI

on:
  push:
    branches: [ master, 'release/*' ]   # release/X.Y: every release is tagged there (RELEASING.md)
  pull_request:
    branches: [ master, 'release/*' ]
  workflow_dispatch:   # started by dependabot-lock-files.yml after it commits regenerated lock files

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. A push to master or a release branch gets a group of its
  # own, by its commit: a shared group would let a third push cancel the second's run while it waited for the first's.
  # So the run of every push finishes, and its commit can be released (release.yml requires that run).
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    uses: ./.github/workflows/build-test.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      # SonarCloud analyses pushes to master and release/*, whose runs release.yml requires, and every pull request
      # into them. A fork's or Dependabot's pull request gets no SONAR_TOKEN, so its Sonar step fails until a
      # maintainer runs the change from a branch of this repository. A run started by hand or by
      # dependabot-lock-files.yml is neither a push nor a pull request.
      run_sonar: ${{ github.event_name != 'workflow_dispatch' }}

  # Windows, where paths use backslashes: restore and build only (the tests need Docker with Linux containers).
  windows-build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Tenantry.slnx --locked-mode

      - name: Build
        run: dotnet build Tenantry.slnx -c Release --no-restore

  # The .NET 11 preview lane (scripts/test-net11.sh): net11.0 builds and tests against the release candidate.
  # It does not block: a release candidate can break things GA fixes, so a failure here is a warning to
  # investigate, not a merge gate.
  net11-preview:
    name: .NET 11 preview lane
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer needs full history

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Use the .NET 11 SDK
        # global.json pins the 10.0 SDK band; this lane needs 11.0. The rest stays: it opts `dotnet test` into
        # Microsoft Testing Platform.
        run: jq 'del(.sdk)' global.json > global.json.lane && mv global.json.lane global.json && dotnet --version

      - name: Build and test for net11.0
        run: bash scripts/test-net11.sh
