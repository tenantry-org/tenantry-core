name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # superseded PR pushes can be cancelled

jobs:
  build-and-test:
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
