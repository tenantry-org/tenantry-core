name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v0.1.0-alpha, v1.0.0, etc.
  # Actions → Release → Run workflow is a dry run: the same checks and packages as a release, then the
  # dry-run job lists what a release would publish instead of publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: 'Also show the notes a release of this tag (v1.2.3) would publish, from CHANGELOG.md'
        required: false
        default: ''

permissions:
  contents: read   # default least privilege; publish job opts into more below

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-done publish

jobs:
  # Release only commits on the tag's own branch, release/X.Y, which CI has already built and tested, and which master
  # does not contain: a tag pushed anywhere else (master's history, another minor's branch, an unmerged branch, or a
  # stray or mistyped tag) fails here before anything is built.
  source:
    name: Tag is on its release branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # the tagged commit's CI runs
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all branches and tags, so origin/release/* and the release tags are available

      - name: Require the tagged commit to be on its release branch
        # vX.Y.Z only from release/X.Y; a dry run on master or on a release branch itself (scripts/release-source.sh)
        id: branch
        run: |
          git fetch --quiet --force --tags origin
          branch="$(bash scripts/release-source.sh)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Require CI to have passed on the tagged commit
        # The run of ci.yml for the push that put the commit on its release branch. SonarCloud analyses master only
        # (ci.yml says why), where every change a release branch holds landed first.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --branch "$BRANCH" --status success --json databaseId --jq 'length')"
          if [ "$passed" = "0" ]; then
            echo "::error::CI has not passed on $GITHUB_SHA, a push to $BRANCH. Wait for it, or rerun it, before tagging."
            exit 1
          fi

      - name: Find whether this is the newest release
        # GitHub shows one release as Latest. A patch to an older minor, or a prerelease, must not take that from a
        # newer release, so only the highest version among the release tags is marked.
        id: latest
        if: github.event_name == 'push'
        run: |
          # Release versions only (vX.Y.Z, no prerelease part, no leading zeros): a stray tag cannot take Latest.
          release='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          newest="$(git tag --list 'v[0-9]*' | { grep -E "$release" || true; } | sort -V | tail -n 1)"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the release's notes in CHANGELOG.md
        # Its "## [x.y.z]" section is the GitHub release's notes (scripts/release-notes.sh)
        if: github.event_name == 'push'
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      - name: Require the release's notes in master's CHANGELOG.md too
        # Every section added to a release branch is also added to master's (RELEASING.md), so the next minor's
        # changelog keeps it. A new minor's section reaches master as the cherry-pick pushed before the tag.
        if: github.event_name == 'push'
        run: |
          git show refs/remotes/origin/master:CHANGELOG.md > "$RUNNER_TEMP/master-CHANGELOG.md"
          bash scripts/release-notes.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/master-CHANGELOG.md" > /dev/null || {
            echo "::error::master's CHANGELOG.md has no ## [${GITHUB_REF_NAME#v}] section: add it there, then rerun"
            exit 1
          }

      - name: Require a patch's package baseline in its own minor
        # Pack checks each package against TenantryPackageBaseline. For a patch X.Y.Z (Z > 0) it must be a release of
        # X.Y, raised after X.Y.0 (RELEASING.md), not necessarily the latest: against the previous minor, a break in an
        # API added in X.Y.0 would pass. A dry run with a version checks it too.
        if: github.event_name == 'push' || inputs.version != ''
        env:
          RELEASE: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          baseline="$(sed -n 's:.*<TenantryPackageBaseline>\(.*\)</TenantryPackageBaseline>.*:\1:p' Directory.Build.props)"
          if [[ "${RELEASE#v}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) && "${BASH_REMATCH[3]}" != 0 &&
                "$(cut -d . -f 1-2 <<<"$baseline")" != "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" ]]; then
            echo "::error::TenantryPackageBaseline is ${baseline:-empty}, but pack must check the patch $RELEASE" \
              "against a release of ${BASH_REMATCH[1]}.${BASH_REMATCH[2]}: raise it on the release branch" \
              "(RELEASING.md, After any release)"
            exit 1
          fi

      - name: Require the version to be unpublished on NuGet.org
        # A published version cannot be replaced, and the push below refuses a duplicate: a moved or re-pushed tag for
        # a released version stops here, before anything is built, rather than releasing packages whose checksums do not
        # match the published ones. A dry run with a version checks that version.
        if: github.event_name == 'push' || inputs.version != ''
        env:
          RELEASE: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          ids=()
          for project in src/*/*.csproj templates/Tenantry.Templates.csproj; do
            ids+=("$(basename "$project" .csproj)")
          done
          bash scripts/check-unpublished.sh "${RELEASE#v}" "${ids[@]}"

  # Re-run build + tests + coverage gate + AOT publish against the tagged commit before
  # publishing. SonarCloud is skipped: it analyses master only (ci.yml says why), and the source job checked that the
  # tagged commit passed CI on its release branch.
  ci:
    needs: source
    uses: ./.github/workflows/build-test.yml
    with:
      run_sonar: false

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [source, ci]
    if: github.event_name == 'push'
    environment: release   # manual-approval gate + OIDC scoped to this environment (see repo settings)
    permissions:
      id-token: write      # GitHub OIDC tokens, for NuGet.org's trusted publishing and the provenance attestation
      contents: write      # needed for creating the release
      attestations: write        # the packages' build provenance
      artifact-metadata: write   # the attestation's artifact storage record

    steps:
      # Before the packages: checkout empties the folder it checks out into.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # only CHANGELOG.md and the script are needed

      # Publish the packages the ci job built, tested and checked (build-test.yml), not a rebuild.
      - name: Download the tested packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Attest the packages' build provenance
        # Signed with this workflow's identity, for the packages as built, which the GitHub release attaches:
        # `gh attestation verify <package> --repo tenantry-org/tenantry-core` on one of those shows it was built by
        # this workflow from the tagged commit. NuGet.org's copy carries NuGet.org's repository signature too, so it
        # hashes differently; `dotnet nuget verify --all` on it prints its content hash, the SHA-512 of the attested
        # package (RELEASING.md).
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: Write the packages' checksums
        run: cd artifacts && sha256sum -- *.nupkg *.snupkg > SHA256SUMS

      - name: Write the release notes
        # The tag's section of CHANGELOG.md, before anything is published
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Check the packages carry the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in ./artifacts/*.nupkg; do
            actual="$(unzip -p "$package" '*.nuspec' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)"
            if [ "$actual" != "$version" ]; then
              echo "::error::$package is version $actual, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        # The key reaches the script as an environment variable, never expanded into the script text.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # No --skip-duplicate: a version already there fails the push rather than being skipped (RELEASING.md says what
        # to do when a release stops part way). The glob pushes in name order, so Tenantry.Templates goes after the
        # libraries, and a future package whose name sorts after it would be pushed after it.
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        # The packages are on NuGet.org; the release carries them as built, which the attestations and checksums
        # match, and their SBOMs. A version with a prerelease suffix (v0.6.0-rc.1) is a prerelease, and only the
        # highest version is the latest release: a patch to an older minor is not.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ needs.source.outputs.latest }}
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/SHA256SUMS
            ./artifacts/sbom/*.cdx.json

  dry-run:
    name: Dry run (nothing is published)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the tested packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./artifacts

      - name: List what a release would publish
        run: |
          for package in ./artifacts/*.nupkg ./artifacts/*.snupkg; do
            version="$(unzip -p "$package" '*.nuspec' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)"
            echo "$(basename "$package")  (version $version)"
          done
          ls ./artifacts/sbom
          echo "A release would attest each package's provenance, push each .nupkg to NuGet.org, with any .snupkg"
          echo "beside it to the NuGet.org symbol server, and create a GitHub release with its CHANGELOG.md section as"
          echo "notes and the packages, their checksums and SBOMs attached."

      - name: Show the release notes
        if: inputs.version != ''
        # The input reaches the script as an environment variable, never expanded into the script text.
        env:
          RELEASE: ${{ inputs.version }}
        run: bash scripts/release-notes.sh "$RELEASE"
