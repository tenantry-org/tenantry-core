name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v0.1.0-alpha, v1.0.0, etc.
  # Actions → Release → Run workflow is a dry run: the same checks and packages as a release, then the
  # dry-run job lists what a release would publish instead of publishing anything.
  workflow_dispatch:

permissions:
  contents: read   # default least privilege; publish job opts into more below

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-done publish

jobs:
  # Release only commits on master, which CI has already built and tested: a tag pushed anywhere else
  # (a stray or mistyped tag, or one on an unmerged branch) fails here before anything is built.
  on-master:
    name: Tag is on master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all branches, so origin/master is available

      - name: Require the tagged commit to be on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master; only commits on master are released"
            exit 1
          fi

  # Re-run build + tests + coverage gate + AOT publish against the tagged commit before
  # publishing. SonarCloud is skipped: it cannot analyze a tag ref (auto-detection fails with
  # "Not authorized or project not found"), and the tagged commit already passed the Sonar
  # quality gate on master before it was tagged.
  ci:
    needs: on-master
    uses: ./.github/workflows/build-test.yml
    secrets: inherit
    with:
      run_sonar: false

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    environment: release   # manual-approval gate + OIDC scoped to this environment (see repo settings)
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
      contents: write  # needed for creating releases; also allows the action to read the repo for changelog generation

    steps:
      # Publish the packages the ci job built, tested and checked (build-test.yml), not a rebuild.
      - name: Download the tested packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Check the packages carry the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in ./artifacts/*.nupkg; do
            actual="$(unzip -p "$package" '*.nuspec' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)"
            if [ "$actual" != "$version" ]; then
              echo "::error::$package is version $actual, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        # The key reaches the script as an environment variable, never expanded into the script text.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        # Release notes only: the packages and their symbols are on NuGet.org, so nothing is attached.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true

  dry-run:
    name: Dry run (nothing is published)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Download the tested packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: List what a release would publish
        run: |
          for package in ./artifacts/*.nupkg ./artifacts/*.snupkg; do
            version="$(unzip -p "$package" '*.nuspec' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)"
            echo "$(basename "$package")  (version $version)"
          done
          echo "A release would push each .nupkg to NuGet.org, with its .snupkg to the NuGet.org symbol"
          echo "server, and create a GitHub release with notes and no attached files."
