name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v0.1.0-alpha, v1.0.0, etc.
  # Actions → Release → Run workflow is a dry run: the same checks and packages as a release, then the
  # dry-run job lists what a release would publish instead of publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: 'Also show the notes a release of this tag (v1.2.3) would publish, from CHANGELOG.md'
        required: false
        default: ''

permissions:
  contents: read   # default least privilege; publish job opts into more below

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-done publish

jobs:
  # Release only commits on master, which CI has already built and tested: a tag pushed anywhere else
  # (a stray or mistyped tag, or one on an unmerged branch) fails here before anything is built.
  on-master:
    name: Tag is on master
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # the tagged commit's CI runs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all branches, so origin/master is available

      - name: Require the tagged commit to be on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master; only commits on master are released"
            exit 1
          fi

      - name: Require CI, SonarCloud included, to have passed on the tagged commit
        # The rerun below skips SonarCloud, so this is where its quality gate is required: CI on master runs it in the
        # Build & Test job, which fails when the gate does.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --status success --json databaseId --jq 'length')"
          if [ "$passed" = "0" ]; then
            echo "::error::CI has not passed on $GITHUB_SHA, a push to master. Wait for it, or rerun it, before tagging."
            exit 1
          fi

      - name: Require the release's notes in CHANGELOG.md
        # Its "## [x.y.z]" section is the GitHub release's notes (scripts/release-notes.sh)
        if: github.event_name == 'push'
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

  # Re-run build + tests + coverage gate + AOT publish against the tagged commit before
  # publishing. SonarCloud is skipped: it cannot analyze a tag ref (auto-detection fails with
  # "Not authorized or project not found"), and on-master checked that the tagged commit passed
  # CI, the Sonar quality gate included, on master.
  ci:
    needs: on-master
    uses: ./.github/workflows/build-test.yml
    with:
      run_sonar: false

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    environment: release   # manual-approval gate + OIDC scoped to this environment (see repo settings)
    permissions:
      id-token: write      # GitHub OIDC tokens, for NuGet.org's trusted publishing and the provenance attestation
      contents: write      # needed for creating the release
      attestations: write        # the packages' build provenance
      artifact-metadata: write   # the attestation's artifact storage record

    steps:
      # Before the packages: checkout empties the folder it checks out into.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # only CHANGELOG.md and the script are needed

      # Publish the packages the ci job built, tested and checked (build-test.yml), not a rebuild.
      - name: Download the tested packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Attest the packages' build provenance
        # Signed with this workflow's identity: `gh attestation verify <package> --repo tenantry-org/tenantry-core`
        # shows a package was built by this workflow from the tagged commit.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: Write the packages' checksums
        run: cd artifacts && sha256sum -- *.nupkg *.snupkg > SHA256SUMS

      - name: Write the release notes
        # The tag's section of CHANGELOG.md, before anything is published
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Check the packages carry the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in ./artifacts/*.nupkg; do
            actual="$(unzip -p "$package" '*.nuspec' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)"
            if [ "$actual" != "$version" ]; then
              echo "::error::$package is version $actual, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        # The key reaches the script as an environment variable, never expanded into the script text.
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        # The packages are on NuGet.org; the release carries their checksums and SBOMs. A version with a
        # prerelease suffix (v0.6.0-rc.1) is a prerelease and never the latest release.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            ./artifacts/SHA256SUMS
            ./artifacts/sbom/*.cdx.json

  dry-run:
    name: Dry run (nothing is published)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the tested packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./artifacts

      - name: List what a release would publish
        run: |
          for package in ./artifacts/*.nupkg ./artifacts/*.snupkg; do
            version="$(unzip -p "$package" '*.nuspec' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)"
            echo "$(basename "$package")  (version $version)"
          done
          ls ./artifacts/sbom
          echo "A release would attest each package's provenance, push each .nupkg to NuGet.org, with its .snupkg"
          echo "to the NuGet.org symbol server, and create a GitHub release with its CHANGELOG.md section as notes and"
          echo "the packages' checksums and SBOMs attached."

      - name: Show the release notes
        if: inputs.version != ''
        # The input reaches the script as an environment variable, never expanded into the script text.
        env:
          RELEASE: ${{ inputs.version }}
        run: bash scripts/release-notes.sh "$RELEASE"
