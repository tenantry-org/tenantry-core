name: Build & Test

on:
  workflow_call:   # reusable: invoked by ci.yml (push/PR) and release.yml (tags)
    inputs:
      run_sonar:
        description: >
          Run SonarCloud analysis + quality gate. ci.yml enables it for master and pull requests into
          master only (it says why); release.yml never does, as what a release branch holds was
          analysed on master.
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        description: SonarCloud's token, needed only when run_sonar is true.
        required: false

permissions:
  contents: read   # least privilege; this workflow only reads the repo

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer needs full history; SonarCloud needs it for SCM blame

      - name: Pull the database images in the background
        # The integration tests' database images (tests/Tenantry.IntegrationTests/Providers/compose.yml), pulled while
        # the steps below check and build: otherwise the tests' first framework spends about 35 seconds pulling them.
        # Nothing waits for this pull and its result does not matter: Testcontainers pulls any image still missing.
        run: >
          nohup docker compose -f tests/Tenantry.IntegrationTests/Providers/compose.yml pull --quiet
          < /dev/null > "$RUNNER_TEMP/database-images.log" 2>&1 &

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Show selected SDK
        # global.json pins the 10.0 feature band, so an installed preview SDK is never used.
        run: dotnet --version

      - name: Setup Java (required by the Sonar scanner)
        if: ${{ inputs.run_sonar }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Restore tools
        # The versions dotnet-tools.json pins (the Sonar scanner, ReportGenerator, CycloneDX, docfx, dotnet-coverage),
        # so a new release of a tool never changes a build, a release build included
        run: dotnet tool restore

      - name: Restore
        # Locked: fails if a test or sample project's packages.lock.json is out of date
        run: dotnet restore Tenantry.slnx --locked-mode

      - name: SonarCloud begin
        if: ${{ inputs.run_sonar }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"tenantry-org_tenantry-core"
          /o:"tenantry-org"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage/coverage.xml"
          /d:sonar.coverage.exclusions="samples/**"
          /d:sonar.cpd.exclusions="samples/**"
          /d:sonar.qualitygate.wait=true

      - name: Check every published floor is tested
        # The minimum dependency lane: each src version range's floor must be what some test's lock file resolves
        run: dotnet run scripts/check-dependency-floors.cs

      - name: Build
        run: dotnet build Tenantry.slnx -c Release --no-restore

      - name: Smoke-start the samples
        # Each sample starts in Development (the host validates its registrations when built) and answers a
        # request for a tenant, or runs to completion (see the script)
        run: bash scripts/smoke-samples.sh
        timeout-minutes: 10

      - name: Test (all) + coverage
        # On Microsoft Testing Platform (global.json); dotnet-coverage writes coverage/coverage.xml (see the script)
        run: bash scripts/test-with-coverage.sh

      - name: SonarCloud end (uploads analysis, fails on quality gate)
        if: ${{ inputs.run_sonar }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Coverage gate (>= 90% line coverage)
        run: |
          dotnet reportgenerator \
            -reports:coverage/coverage.xml \
            -targetdir:coverage/report \
            -reporttypes:JsonSummary
          line=$(jq '.summary.linecoverage' coverage/report/Summary.json)
          echo "Total line coverage: ${line}%"
          awk "BEGIN { exit !(${line} >= 90) }" || {
            echo "::error::Line coverage ${line}% is below the required 90%"
            exit 1
          }

      - name: Pack
        # Each src project, then the dotnet new templates (templates/), which the solution leaves out, so their pack
        # builds them. Packing the solution would warn about every other project.
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -o ./artifacts
          done
          dotnet pack templates/Tenantry.Templates.csproj -c Release -o ./artifacts

      - name: Software bills of materials
        # A CycloneDX SBOM per package, which the release attaches to the GitHub release with the packages' checksums
        run: |
          mkdir -p ./artifacts/sbom
          for project in src/*/*.csproj templates/Tenantry.Templates.csproj; do
            name="$(basename "$project" .csproj)"
            package="$(ls ./artifacts/"$name".[0-9]*.nupkg)"
            version="$(unzip -p "$package" '*.nuspec' | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -n 1)"
            dotnet CycloneDX "$project" -o ./artifacts/sbom -fn "$name.cdx.json" -F Json -ed \
              -st Library -sn "$name" -sv "$version" --set-nuget-purl
          done

      - name: Check package dependency ranges
        # Fails on a dependency without its intended range: exact for a sibling whose internals it uses, a minimum only
        # for Microsoft.Extensions.*, otherwise up to the next breaking version (see the script)
        run: dotnet run scripts/check-package-ranges.cs -- ./artifacts

      - name: Consumer check
        # A stand-in application restores these packages from an empty cache with package source mapping,
        # builds for every target framework and runs, as an application would (see the script). Without the templates
        # package, which an application cannot reference: the script checks every package in the folder it is given.
        run: |
          rm -rf ./artifacts/libraries
          mkdir ./artifacts/libraries
          cp ./artifacts/*.nupkg ./artifacts/libraries/
          rm ./artifacts/libraries/Tenantry.Templates.[0-9]*.nupkg
          bash scripts/check-package-consumer.sh ./artifacts/libraries 'Tenantry.*'

      - name: Smoke-test the templates
        # The dotnet new templates: each is created from the templates package packed above, the one a release
        # publishes, built against these packages with warnings as errors, and run (see the script)
        run: bash scripts/smoke-templates.sh ./artifacts
        timeout-minutes: 10

      - name: Check the documentation's code blocks
        # Every ```csharp block in the README and docs builds against these packages (see the script). The first
        # pattern names the package whose version the snippets reference.
        run: bash scripts/check-doc-snippets.sh ./artifacts 'Tenantry.Core' 'Tenantry.*'

      - name: Upload packages
        # The release job publishes exactly these packages: the ones built, tested and checked above. On master,
        # ci.yml's prerelease job publishes them without the templates package.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # The checks that need neither the tests nor the packages, beside the job above to shorten the run: the workflows,
  # the Dependabot configuration, the documentation's names and links, formatting, the API reference and the Native
  # AOT publish. A caller's job that needs this workflow waits for both jobs (ci.yml's prerelease, release.yml's
  # publish), and the packages come only from the job above.
  checks:
    name: Checks and Native AOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # MinVer needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Show selected SDK
        # global.json pins the 10.0 feature band, so an installed preview SDK is never used.
        run: dotnet --version

      - name: Check every action is pinned to a commit
        # A tag can be moved; a commit cannot. Dependabot keeps the pins and their version comments up to date.
        run: |
          if grep -rnE '^\s*(-\s*)?uses:\s*[^./][^@]*@' .github/workflows | grep -vE '@[0-9a-f]{40}( |$)'; then
            echo "::error::Pin these actions to a full commit SHA, with the version in a comment (uses: owner/repo@<sha> # vX.Y.Z)"
            exit 1
          fi

      - name: Lint the workflows
        # actionlint checks the workflows' syntax and expressions, and runs shellcheck on each run block
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12   # a new actionlint release never changes a build

      - name: Check the Dependabot configuration
        # Its list of banded packages (version ranges, per-framework versions) must match the project files
        run: dotnet run scripts/check-dependabot.cs

      - name: Check for removed names
        # The README, docs, samples and src name no API or package that no longer exists (eng/common/removed-names.txt)
        run: dotnet run scripts/check-removed-names.cs

      - name: Check the documentation's links
        # Every link in the README, docs and samples reaches a file, page and heading, as tenantry.dev serves docs/
        run: dotnet run scripts/check-doc-links.cs

      - name: Restore
        # Locked: fails if a test or sample project's packages.lock.json is out of date
        run: dotnet restore Tenantry.slnx --locked-mode

      - name: Check formatting
        # .editorconfig; fix locally with `dotnet format Tenantry.slnx`
        run: dotnet format Tenantry.slnx --verify-no-changes --no-restore

      - name: Check the API reference
        # docs/api is generated from the XML documentation comments; a change to the public API or its comments
        # must commit the regenerated pages (scripts/generate-api-docs.sh)
        run: bash scripts/generate-api-docs.sh --check

      - name: Verify AOT publish
        run: dotnet publish samples/Tenantry.Samples.Aot -c Release

      # Tenantry.Http and Tenantry.Caching, rooted whole, and their generic paths, which only a whole-program compile
      # checks; then the native binary runs them (eng/aot-smoke).
      - name: Native AOT smoke test
        run: |
          dotnet publish eng/aot-smoke -c Release -o ./artifacts/aot-smoke
          ./artifacts/aot-smoke/AotSmoke
